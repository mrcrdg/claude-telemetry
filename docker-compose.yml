# Local observability stack for Claude Code token usage.
# Everything binds to localhost only — no cloud services, no external egress.
#
#   Claude Code  --(OTLP gRPC :4317)-->  otel-collector
#   otel-collector  --(Prometheus :8889)-->  prometheus (scrapes)
#   grafana  --(PromQL :9090)-->  prometheus
#
# Start with:  docker compose up -d
# Grafana:     http://localhost:3000  (admin / admin)

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: claude-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC — Claude Code exports here
      - "127.0.0.1:8889:8889"   # Prometheus scrape endpoint (exposed metrics)
    restart: unless-stopped

  # Reads Claude Code transcripts and exposes claude_session_info{session_id,
  # title,started,project} so the dashboard can label opaque session UUIDs with
  # each chat's human title. Transcripts are mounted read-only.
  session-labeler:
    build: ./session-labeler
    container_name: claude-session-labeler
    volumes:
      - ${CLAUDE_PROJECTS_DIR:-$HOME/.claude/projects}:/data/projects:ro
    environment:
      - CLAUDE_PROJECTS_DIR=/data/projects
      - LABELER_REFRESH_SECONDS=60
    ports:
      - "127.0.0.1:9105:9105"   # Prometheus scrape endpoint
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: claude-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
      # Lets `curl -X POST localhost:9090/-/reload` apply rule/config edits
      # without restarting. Worth having: a restart re-reads the TSDB head, and
      # if stray blocks overlap it (e.g. left over from a rule backfill) the
      # head gets truncated and recent samples are lost. Only reachable from
      # localhost — the port is bound to 127.0.0.1 in `ports` below.
      - "--web.enable-lifecycle"
      # Needed by the delete_series admin endpoint, which is how mislabelled
      # series get corrected (project labels are baked into a series at write
      # time, so a relabel means delete + re-import). Localhost-only, as above.
      - "--web.enable-admin-api"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - otel-collector
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.1
    container_name: claude-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: claude-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_DEFAULT_THEME=dark
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # Local-only tool — silence the "change default password" nag.
      - GF_SECURITY_DISABLE_INITIAL_ADMIN_PASSWORD_CHANGE=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  loki-data:
  prometheus-data:
  grafana-data:
