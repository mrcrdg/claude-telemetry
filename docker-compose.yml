# Local observability stack for Claude Code token usage.
# Everything binds to localhost only — no cloud services, no external egress.
#
#   Claude Code  --(OTLP gRPC :4317)-->  otel-collector
#   otel-collector  --(Prometheus :8889)-->  prometheus (scrapes)
#   grafana  --(PromQL :9090)-->  prometheus
#
# Start with:  docker compose up -d
# Grafana:     http://localhost:3000  (admin / admin)

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: claude-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC — Claude Code exports here
      - "127.0.0.1:8889:8889"   # Prometheus scrape endpoint (exposed metrics)
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: claude-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
      # Lets `curl -X POST localhost:9090/-/reload` apply rule/config edits
      # without restarting. Worth having: a restart re-reads the TSDB head, and
      # if stray blocks overlap it (e.g. left over from a rule backfill) the
      # head gets truncated and recent samples are lost. Only reachable from
      # localhost — the port is bound to 127.0.0.1 in `ports` below.
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - otel-collector
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: claude-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_DEFAULT_THEME=dark
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # Local-only tool — silence the "change default password" nag.
      - GF_SECURITY_DISABLE_INITIAL_ADMIN_PASSWORD_CHANGE=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
